spring.application.name=backend

spring.datasource.url=jdbc:h2:mem:testdb
#jdbc: type of connection
#h2: it's a H2 database
#mem: the db is in the ram
#testdb: the chosen name of the db

spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.jpa.show-sql=true
#shows the sql queries in the console

spring.jpa.hibernate.ddl-auto=update
#forces Hibernate to reconstruct the tables at every start of the app

spring.data.web.pageable.max-page-size=50
#sets the maximum page size for GET MANY requests to 50

# Select dev or auth explicitly; there is no default security profile.

#Open Route Service
ors.api-key=${ORS_API_KEY:}

spring.config.import=optional:file:.env[.properties]
ors.base-url=https://api.heigit.org/openrouteservice
ors.connect-timeout-ms=3000
ors.read-timeout-ms=12000
ors.corridor-margin-meters=500
