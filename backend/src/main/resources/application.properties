spring.application.name=backend

spring.datasource.url=jdbc:h2:mem:testdb
#jdbc: type of connection
#h2: it's a H2 database
#mem: the db is in the ram
#testdb: the chosen name of the db

spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.jpa.show-sql=true
#shows the sql queries in the console

spring.jpa.hibernate.ddl-auto=update
#forces Hibernate to reconstruct the tables at every start of the app

spring.data.web.pageable.max-page-size=50
#sets the maximum page size for GET MANY requests to 50

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
#activates H2 console for debugging





